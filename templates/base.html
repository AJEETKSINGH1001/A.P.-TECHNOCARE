{% load static %}

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
            {{ site_name|default:"A.P. TECHNOCARE" }}
        {% endblock %}
    </title>

    <meta
        name="description"
        content="{% block meta_description %}Professional industrial products and solutions.{% endblock %}"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/site.css' %}"
    >

    {% block extra_head %}{% endblock %}
</head>

<body>

<header>
    {% block header %}
    {% endblock %}
</header>

<main id="main-content">
    {% block content %}
    {% endblock %}
</main>

<footer>
    {% block footer %}
    {% endblock %}
</footer>

{% block extra_js %}
{% endblock %}

</body>
</html>
